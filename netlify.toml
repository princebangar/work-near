# Netlify: build the React app inside Frontend/ (this repo also contains Backend/).
[build]
  base = "Frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Point these at the hosted backend (set in Netlify UI): VITE_API_BASE_URL=https://api.../api/v1, VITE_BACKEND_ORIGIN=https://api...
  # VITE_GOOGLE_MAPS_API_KEY → set in Netlify UI (Project configuration → Environment variables), not here.

# SPA: let React Router handle every path (/login, /admin, /worker/w1 ...).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets never change → cache for a year. index.html is always revalidated.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
